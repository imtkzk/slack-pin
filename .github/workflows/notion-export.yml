name: Notion Export (Filtered)

on:
  schedule:
    # 毎週木曜 16:00 JST (= 07:00 UTC)
    - cron: '0 7 * * 4'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: read
  actions: write # keepalive（ワークフロー再有効化）に必要

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notion export
        env:
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          python get_pins.py --notion --public-only --exclude-assignees "my1806" "Quynh Anh （アイン）" "Kyoichi Watanabe" "Noriyuki Mizuno" "hisatake" "Kunihiro Okamura"

      # コミットが60日間なくてもスケジュール実行が自動停止されないよう、
      # 実行のたびに自分自身を再有効化して非アクティブタイマーをリセットする
      - name: Keepalive (prevent 60-day inactivity disable)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/notion-export.yml/enable"
